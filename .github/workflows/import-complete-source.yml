name: Import and verify complete Yes Bot system
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-complete-source.yml

permissions:
  contents: write

concurrency:
  group: initial-import-${{ github.repository }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: yesbot_test
          POSTGRES_USER: yesbot
          POSTGRES_PASSWORD: yesbot
        ports:
          - 5445:5432
        options: >-
          --health-cmd "pg_isready -U yesbot"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy all files from original source and rebrand
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --quiet https://github.com/tekleabkidus-commits/LiyubetBot.git /tmp/telegram-source
          echo "Source commit: $(git -C /tmp/telegram-source rev-parse HEAD)"
          rsync --archive --delete --exclude='/.git/' --exclude='/.github/' --exclude='/scripts/' /tmp/telegram-source/ ./
          python3 scripts/rebrand_import.py
          test -f artisan
          test -f composer.lock
          test -f package-lock.json
          test -f app/Http/Controllers/TelegramWebhookController.php
          test -f app/Services/Rewards/RewardService.php
          test -f app/Filament/Pages/BotMessages.php
          test -f public/fonts/filament/filament/inter/inter-latin-wght-normal-NRMW37G5.woff2
          echo "Full copy and rebranding completed."

      - name: Install PHP 8.4 runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, zip, gd, bcmath, pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Check Composer and PHP source
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n 1 php -l > /tmp/php-lint-results.log
          echo "Validated $(wc -l </tmp/php-lint-results.log) PHP source files."

      - name: Commit full branded source into main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Import complete source and rebrand as Yes Bot"
          fi
          git push origin HEAD:main
          echo "Published complete Yes Bot system."

      - name: Install PHP dependencies and create isolated test key
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force

      - name: Verify frontend dependencies and build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Execute isolated Laravel test suite
        shell: bash
        env:
          APP_ENV: testing
        run: |
          set -euo pipefail
          php artisan test
